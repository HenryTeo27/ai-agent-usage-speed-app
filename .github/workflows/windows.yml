name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v test_meter
      - shell: pwsh
        run: ./scripts/build.ps1 -Python (Get-Command python).Source
      - shell: pwsh
        run: ./scripts/smoke-package.ps1 -Executable (Join-Path $PWD 'dist/CodexMeter/CodexMeter.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows-x64
          path: release/Codex-Meter-Windows-x64.zip
